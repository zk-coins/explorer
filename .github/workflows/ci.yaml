name: CI

on:
  workflow_dispatch:

  # CI runs on every pull request regardless of target branch. This
  # makes the default safe for stacked PRs (PR-A → PR-B → PR-C where
  # each PR's base is the previous PR's branch) and any other workflow
  # that opens a PR against a non-`develop` branch — previously such
  # PRs were silently skipped because `branches: [develop]` filtered
  # them out, and the only fix was to hand-edit ci.yaml on each new
  # feature stack.
  #
  # `push: develop` is intentionally absent. Every commit reaching
  # `develop` is already covered by an open PR's `synchronize` event;
  # adding `on: push: branches: [develop]` would queue a second
  # workflow instance on the same SHA. (Under the PR-number grouping
  # in the concurrency block below the two runs would land in
  # DIFFERENT groups — push keyed by `refs/heads/develop`, PR keyed
  # by the PR's number — so the block would not deduplicate them.)
  #
  # `ready_for_review` is added so the workflow fires the moment a
  # draft PR is marked ready — drafts themselves skip CI via the
  # `if:` guard on the job (saves runner time while work is still in
  # progress).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # Group by PR number so a new push to the same PR cancels the
  # in-flight run on the outdated commit. Grouping by SHA would put
  # every commit in its own group, so `cancel-in-progress: true`
  # never fired and back-to-back pushes queued sequentially.
  # Falls back to `github.ref` for push/dispatch events (where there
  # is no `pull_request.number`), so e.g. a `workflow_dispatch` on
  # the same ref serializes too.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Single job on GitHub-hosted Linux: lint, typecheck, test, build, and
# the fail-closed env-gate (build without NEXT_PUBLIC_NODE_BASE_URL must
# fail). No e2e, no coverage upload, no self-hosted runner.
#
# No `notify-failure` job: this repository does not hold the Telegram
# bot secrets (`TELEGRAM_BOT_TOKEN` / `TELEGRAM_CHAT_ID`). Add one —
# modelled on the node's `notify-failure` job — once those secrets
# are provisioned here.
jobs:
  lint-and-build:
    name: Lint & Build
    # Skip on draft PRs. Non-PR events (push, workflow_dispatch) always
    # run: `github.event.pull_request` is absent there, so the
    # `event_name != 'pull_request'` arm keeps them enabled.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `.nvmrc` and no `engines.node` pin in package.json. Node 22 is
      # what local verification uses (and what the sibling app workflow
      # pins), so CI matches that rather than inventing a floating "latest".
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Dummy origin only — never a real node. next.config.js requires a
      # non-empty http(s) URL at build time; this value is not used as a
      # network target in CI (static export, no server runtime).
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_NODE_BASE_URL: https://ci-node.example.invalid

      # Fail-closed contract: NEXT_PUBLIC_NODE_BASE_URL has no default.
      # A build without it must fail (next.config.js throws). Invert the
      # exit code so this step cannot go green if the guard is removed or
      # an env value leaks in. Never `|| true` — that would mask a broken
      # contract as success.
      - name: Build without NEXT_PUBLIC_NODE_BASE_URL must fail
        run: |
          if npm run build; then
            echo "::error::build succeeded without NEXT_PUBLIC_NODE_BASE_URL; fail-closed contract is broken"
            exit 1
          fi
          echo "build failed as required (fail-closed holds)"
